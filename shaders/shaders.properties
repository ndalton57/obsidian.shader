# Tier design: High == the shipped defaults exactly (a fresh install shows
# "High", not "Custom"). Ultra scales up from High; Medium/Low scale down.
# Far-field (SSRT) shadows stay ON in every tier — distant terrain shadowing
# is the pack's look, not a quality extra. Levers: shadow resolution, AO
# method, Shader Grass density/range, cloud march steps, TAAU (Low only),
# plus the cheap shadow/reflection extras on Low. NASA = Ultra with the
# grass maxed out (density 5, full 128-block range).
profile.low    = INFO=0 shadowMapResolution=2048 SHADER_AO=SHADER_AO_SSAO SHADOW_PCF SHADOW_SSRT !SHADOW_COLOR !SHADOW_VPS !ENTITY_SHADOWS !BLOCK_ENTITY_SHADOWS !ENVIRONMENT_REFLECTIONS !AIR_FOG_COLORED_LIGHT_SHAFTS !WATER_CAUSTICS !WATER_PARALLAX GRASS_DENSITY=2 GRASS_RANGE=32.0 minRayMarchSteps=35 maxRayMarchSteps=35 TAAU TAAU_RENDER_SCALE=0.75
profile.medium = INFO=1 shadowMapResolution=3072 SHADER_AO=SHADER_AO_SSAO SHADOW_PCF SHADOW_SSRT  SHADOW_COLOR  SHADOW_VPS  ENTITY_SHADOWS  BLOCK_ENTITY_SHADOWS  ENVIRONMENT_REFLECTIONS  AIR_FOG_COLORED_LIGHT_SHAFTS !WATER_CAUSTICS  WATER_PARALLAX GRASS_DENSITY=2 GRASS_RANGE=48.0 minRayMarchSteps=35 maxRayMarchSteps=35 !TAAU TAAU_RENDER_SCALE=0.75
profile.high   = INFO=2 shadowMapResolution=4096 SHADER_AO=SHADER_AO_GTAO SHADOW_PCF SHADOW_SSRT  SHADOW_COLOR  SHADOW_VPS  ENTITY_SHADOWS  BLOCK_ENTITY_SHADOWS  ENVIRONMENT_REFLECTIONS  AIR_FOG_COLORED_LIGHT_SHAFTS !WATER_CAUSTICS  WATER_PARALLAX GRASS_DENSITY=3 GRASS_RANGE=64.0 minRayMarchSteps=40 maxRayMarchSteps=40 !TAAU TAAU_RENDER_SCALE=0.75
profile.ultra  = INFO=3 shadowMapResolution=4096 SHADER_AO=SHADER_AO_GTAO SHADOW_PCF SHADOW_SSRT  SHADOW_COLOR  SHADOW_VPS  ENTITY_SHADOWS  BLOCK_ENTITY_SHADOWS  ENVIRONMENT_REFLECTIONS  AIR_FOG_COLORED_LIGHT_SHAFTS !WATER_CAUSTICS  WATER_PARALLAX GRASS_DENSITY=4 GRASS_RANGE=96.0 minRayMarchSteps=50 maxRayMarchSteps=50 !TAAU TAAU_RENDER_SCALE=0.75
profile.nasa   = INFO=4 shadowMapResolution=4096 SHADER_AO=SHADER_AO_GTAO SHADOW_PCF SHADOW_SSRT  SHADOW_COLOR  SHADOW_VPS  ENTITY_SHADOWS  BLOCK_ENTITY_SHADOWS  ENVIRONMENT_REFLECTIONS  AIR_FOG_COLORED_LIGHT_SHAFTS !WATER_CAUSTICS  WATER_PARALLAX GRASS_DENSITY=5 GRASS_RANGE=128.0 minRayMarchSteps=50 maxRayMarchSteps=50 !TAAU TAAU_RENDER_SCALE=0.75

