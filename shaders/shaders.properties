#endif

# Shader Grass: grass-block TOP biome tint, captured in the shadow pass (the sun always sees tops)
# so the grass geometry shader can colour blades grown from ANY face with the real top colour. Stored
# per CORNER in a 3D buffer: a 2x2 XZ tile of texels per block, keyed by block X/Y/Z (an ahead-centred
# GRASS_TINT_SIZE^3 voxel region, scene_to_grass_tint_space) so the 4 top vertices each write their own
# texel (race-free, no atomics) AND vertically-stacked grass blocks never share a slot. The shader
# bilinearly blends the 4 corners to reproduce the top's smooth per-position colour. Rebuilt each frame.
# Dims are (2*N, 2*N, N) with N = GRASS_TINT_SIZE in global.glsl (MUST match) - 256 256 128 = ~64 MB.
# grass_tile holds the shared grass_top atlas tile (offset.xy, scale.xy).
#ifdef SHADER_GRASS
image.grass_tint_img = grass_tint_sampler rgba rgba16f half_float true false 256 256 128
# Companion LIGHT buffer (same 2x2-corner layout and dims as the tint): the TOP's lightmap, block
# light in R, sky light in G. Side/bottom growers reproduce it for their blades so brightness doesn't
# flicker as the FCFS grower races between faces (the tint covers colour; this covers light). Written
# alongside the tint in update_grass_tint, read in grass_top_reproduce. rg16f, 256 256 128 = ~33 MB.
image.grass_light_img = grass_light_sampler rg rg16f half_float true false 256 256 128
image.grass_tile_img = grass_tile_sampler rgba rgba16f half_float true false 8 8
#endif

# Shader Grass claim buffer (PROCEDURAL_GEOMETRY_MODE 4 = Race/FCFS): a SINGLE r32ui per-block cell,
# packed (frame_stamp << 3 | winning_face_id). The first drawn face of a block to reach the TCS this
# frame CAS-claims it and grows; the GS reads the winner via a coherent imageLoad in the SAME pass
# (no double buffer, no 1-frame lag - the relabel makes every face plant identically, so the winner
# can vary frame to frame invisibly). ABSOLUTE world-indexed (grass_mask_cell) at GRASS_MASK_SIZE 256
# (MUST match global.glsl), decoupled from the LPV; ~67 MB. Persistent - the frame stamp avoids a
# per-frame clear; an uninitialised (zero) cell reads as stale, so it self-corrects on frame 1.
#if defined SHADER_GRASS && PROCEDURAL_GEOMETRY_MODE >= 4
image.grass_claim_img = grass_claim_sampler red_integer r32ui unsigned_int false false 256 256 256
#endif

