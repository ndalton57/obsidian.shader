#if MC_VERSION >= 11300

# Weak SSS
# Animals and villagers: soft SSS bleed (ears, snouts, wings backlit by the
# sun). Dedicated id - entities are never voxelized, so they cannot use the
# solid-block edge-wrap rim that material 15 gets; the deferred pass exempts
# this mask from the rim path and keeps the per-fragment SSS instead.
entity.10113 = cow mooshroom pig sheep chicken rabbit horse donkey mule fox wolf cat ocelot goat llama trader_llama panda polar_bear camel sniffer armadillo frog axolotl turtle bee villager wandering_trader zombie zombie_villager

# Medium full emissives
entity.10033 = vex allay

# Dim full emissives
entity.10034 = blaze glow_item_frame

# Partial emissives
entity.10036 = magma_cube drowned glow_squid 

# Redstone components
entity.10038 = creaking

# Sculk
entity.10046 = warden

# Pink glow
entity.10047 = end_crystal

# Item
entity.10100 = item

# Boats (also the ripple-sim vehicle check; newer MC versions use per-wood
# entity types)
entity.10101 = boat chest_boat oak_boat oak_chest_boat spruce_boat spruce_chest_boat birch_boat birch_chest_boat jungle_boat jungle_chest_boat acacia_boat acacia_chest_boat dark_oak_boat dark_oak_chest_boat mangrove_boat mangrove_chest_boat cherry_boat cherry_chest_boat pale_oak_boat pale_oak_chest_boat bamboo_raft bamboo_chest_raft

# Lightning bolt
entity.10102 = lightning_bolt

# Stained glass and slime
entity.10064 = slime

